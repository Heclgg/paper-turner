; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-h2-devkitm-1]
; ESP32-H2 需要 Arduino-ESP32 Core v3.x，官方 espressif32 平台不支持，
; 必须使用社区维护的 pioarduino 平台（锁定最新稳定版 55.03.312-1 = Arduino 3.3.12 / IDF 5.5.5）
platform          = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board             = esp32-h2-devkitm-1
framework         = arduino
monitor_speed     = 115200

; ---- Flash 4MB ----
board_build.flash_size = 4MB
board_build.partitions = default.csv

build_flags =
    -DCORE_DEBUG_LEVEL=3

; ---- 上传（H2 原生 USB-Serial/JTAG 支持高速，可用 921600）----
upload_speed      = 115200
upload_port       = COM6
